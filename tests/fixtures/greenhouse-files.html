<!doctype html>
<!-- jobbot regression fixture (2026-10-07): Greenhouse upload slots, structure from the live Pinevale and
     Ironvale forms: div[role=group][aria-labelledby=upload-label-*] holds the question; the file input has its
     own <label> "Attach" five levels down; every button reads "Attach". -->
<html><head><meta charset="utf-8"><title>gh files</title></head>
<body><form id="application-form">
  <div class="file-upload" role="group" aria-labelledby="upload-label-resume" aria-required="true">
    <div class="label upload-label" id="upload-label-resume">Resume/CV<span class="required">*</span></div>
    <div class="file-upload__wrapper"><div><div><div><button type="button">Attach</button><label for="resume">Attach</label><input id="resume" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div></div><div><button type="button">Dropbox</button></div><div><button type="button">Google Drive</button></div><p>Accepted file types: pdf, doc, docx, txt, rtf</p></div></div>
  </div>
  <div class="file-upload" role="group" aria-labelledby="upload-label-cover_letter">
    <div class="label upload-label" id="upload-label-cover_letter">Cover Letter</div>
    <div class="file-upload__wrapper"><div><div><div><button type="button">Attach</button><label for="cover_letter">Attach</label><input id="cover_letter" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div></div><div><button type="button">Dropbox</button></div><div><button type="button">Google Drive</button></div><p>Accepted file types: pdf, doc, docx, txt, rtf</p></div></div>
  </div>
  <div class="file-upload" role="group" aria-labelledby="upload-label-question_68267383" aria-required="true">
    <div class="label upload-label" id="upload-label-question_68267383">Please upload a copy of an unofficial undergraduate transcript.<span class="required">*</span></div>
    <div class="file-upload__wrapper"><div><div><div><button type="button">Attach</button><label for="question_68267383">Attach</label><input id="question_68267383" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div></div><div><button type="button">Dropbox</button></div><div><button type="button">Google Drive</button></div><p>Accepted file types: pdf, doc, docx, txt, rtf</p></div></div>
  </div>
  <button type="submit">Submit application</button>
</form></body></html>
