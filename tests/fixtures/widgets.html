<!doctype html>
<!-- jobbot regression fixture (2026-10-07, Greenhouse Brookvale live run):
     1. a react-select-like School box: typed search text is cleared on blur; on focus it shows a
        default A-list, and only ~400 ms after typing the filtered results;
     2. once picked, the search input goes opacity:0 and the choice shows in .select__single-value;
     3. a disclosure question whose actual question is at the end of a long label. -->
<html><head><meta charset="utf-8"><title>widgets</title>
<style>.select__menu div{padding:4px}.select__input{width:100%}</style></head>
<body><form>
  <label for="first">First Name*</label><input id="first" required>
  <div class="field"><label id="school-label">School*</label>
    <div class="select__control" id="ctl">
      <div class="select__value-container"><div class="select__input-container">
        <input class="select__input" id="school" role="combobox" aria-haspopup="true" aria-expanded="false" aria-labelledby="school-label" aria-required="true">
      </div></div>
    </div>
    <div class="select__menu" id="menu"></div>
  </div>
  <label for="gov">Acme adheres to applicable laws and regulations in relation to government officials given inherent bribery and corruption risk. A government official is any person that performs a public function on any level or acts in any official capacity. Are you related to a government official?*</label>
  <select id="gov" required><option value="">Select...</option><option>Yes</option><option>No</option></select>
  <button type="submit">Submit application</button>
</form>
<script>
  const ALL = ['Aalborg University', 'Aalto University', 'Abilene Christian University', 'Example State University', 'Madison Area Technical College'];
  const input = document.getElementById('school'), menu = document.getElementById('menu'), ctl = document.getElementById('ctl');
  let timer = null;
  function render(list) {
    menu.innerHTML = '';
    for (const t of list) {
      const d = document.createElement('div'); d.setAttribute('role', 'option'); d.textContent = t;
      d.addEventListener('click', () => pick(t)); menu.appendChild(d);
    }
    input.setAttribute('aria-expanded', list.length ? 'true' : 'false');
  }
  function pick(t) {
    menu.innerHTML = ''; input.value = ''; input.style.opacity = '0'; input.setAttribute('aria-expanded', 'false');
    let v = ctl.querySelector('.select__single-value');
    if (!v) { v = document.createElement('div'); v.className = 'select__single-value'; ctl.querySelector('.select__value-container').prepend(v); }
    v.textContent = t;
  }
  ctl.addEventListener('mousedown', () => (menu.children.length ? render([]) : render(ALL.slice(0, 3))));
  input.addEventListener('focus', () => { if (!menu.children.length) render(ALL.slice(0, 3)); });
  input.addEventListener('blur', () => { input.value = ''; });
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.toLowerCase();
    timer = setTimeout(() => render(ALL.filter((t) => t.toLowerCase().includes(q))), 400);
  });
</script></body></html>
