<!doctype html><html><body><form>
<h2>Applicant Questions</h2>
<div class="iCIMS_TableRow"><label for="q1">Have you ever worked at Cedarhall?<span>*</span></label>
<select id="q1" required><option value="">— Make a Selection —</option><option>No</option><option>Yes, current intern</option><option>Yes, former employee</option></select></div>
<div><label for="q2">Who is your most recent employer? (Type N/A if not applicable)<span>*</span></label><input id="q2" type="text" required></div>
<div><label for="q3">Are you currently authorized to work in the United States?<span>*</span></label>
<select id="q3" required><option value="">— Make a Selection —</option><option>Yes, I have US work authorization as a citizen or permanent resident</option><option>Yes, I have temporary US work authorization</option><option>No</option></select></div>
<div><label for="q4">Will you now, or in the future, require employer visa sponsorship (e.g., H-1B)?<span>*</span></label>
<select id="q4" required><option value="">— Make a Selection —</option><option>Yes</option><option>No</option></select></div>
<div><label for="q5">The information being requested in the question below will be used exclusively for making export controls and licensing determinations. This information will not be shared directly with the hiring manager for this position unless coordination for export license application is needed. Is your most recent country of (1) citizenship or (2) permanent residency one of the following countries: North Korea; Syria; Iran; or Cuba?<span>*</span></label>
<select id="q5" required><option value="">— Make a Selection —</option><option>Yes – North Korea</option><option>Yes – Syria</option><option>Yes – Iran</option><option>Yes – Cuba</option><option>No</option></select></div>
<div><label for="q6">I agree to receive automated text messages about my job application and job opportunities from Cedarhall and understand that I can opt out at anytime<span>*</span></label>
<select id="q6" required><option value="">— Make a Selection —</option><option>Yes</option><option>No</option></select></div>
<div><label for="q7">Please use my candidate personal data to consider me for other positions which I may be eligible and qualified for.<span>*</span></label>
<select id="q7" required><option value="">— Make a Selection —</option><option>Yes</option><option>No</option></select></div>
<div><label for="q8">Is your country of citizenship one of the following: North Korea; Syria; Iran; or Cuba?<span>*</span></label>
<select id="q8"><option value="">— Make a Selection —</option><option>Yes – North Korea</option><option>Yes – Syria</option><option>None of these</option></select></div>
<button type="button">Next</button></form></body></html>
